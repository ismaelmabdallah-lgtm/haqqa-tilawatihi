    <path d="M151 229 Q190 214 231 230"/>
    <path d="M149 241 Q190 226 231 242"/>
    <path d="M147 253 Q188 238 231 254"/>
    <path d="M145 265 Q188 250 231 266"/>
    <path d="M143 277 Q185 263 231 278"/>
    <path d="M141 289 Q183 276 231 290"/>

