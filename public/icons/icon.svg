  />


  <!-- ============================= -->
  <!-- Open Quran - left page -->
  <!-- ============================= -->

  <path
    d="
      M256 210

      C224 185 184 176 133 188

      L106 321

      C157 302 207 306 256 340

      Z
    "
    fill="url(#page)"
    stroke="#c9a957"
    stroke-width="3"
  />

  <!-- Left page thickness -->
  <path
    d="
      M106 321
      C157 302 207 306 256 340
      L256 351
      C206 318 157 315 111 333
      Z
    "
    fill="#d7bd78"
  />


  <!-- ============================= -->
  <!-- Open Quran - right page -->
  <!-- ============================= -->

