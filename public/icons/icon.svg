    <path d="M363 241 Q322 226 281 242"/>
    <path d="M365 253 Q324 238 281 254"/>
    <path d="M367 265 Q324 250 281 266"/>
    <path d="M369 277 Q327 263 281 278"/>
    <path d="M371 289 Q329 276 281 290"/>

