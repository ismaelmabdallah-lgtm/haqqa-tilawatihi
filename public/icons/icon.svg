        M0 -43
        L8 -20
        L31 -12
        L10 -3
        L0 20
        L-10 -3
        L-31 -12
        L-8 -20
        Z
      "
      fill="url(#gold)"
      opacity="0.95"
    />

  </g>


  <!-- Subtle highlight -->
  <ellipse
    cx="256"
    cy="105"
    rx="125"
    ry="45"
    fill="#ffffff"
    opacity="0.035"
  />

</svg>