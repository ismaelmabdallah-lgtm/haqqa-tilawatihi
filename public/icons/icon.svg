<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- Background -->
  <defs>

    <!-- Dark green background -->
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#145f46"/>
      <stop offset="70%" stop-color="#075039"/>
      <stop offset="100%" stop-color="#023b2a"/>
    </radialGradient>

    <!-- Gold -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9dc86"/>
      <stop offset="45%" stop-color="#d9a943"/>
      <stop offset="100%" stop-color="#a87522"/>
    </linearGradient>

    <!-- Page -->
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf1"/>
      <stop offset="70%" stop-color="#f4e7bd"/>
      <stop offset="100%" stop-color="#dfc887"/>
    </linearGradient>

    <!-- Page shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Soft glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

  </defs>


  <!-- Rounded square background -->
  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#bg)"
  />


  <!-- ============================= -->
  <!-- Islamic decorative arch -->
  <!-- ============================= -->

  <path
    d="
      M256 58
      C214 105 154 113 124 160
      C104 191 105 234 105 275
      V352
      C105 365 116 376 129 376
      H383
      C396 376 407 365 407 352
      V275
      C407 234 408 191 388 160
      C358 113 298 105 256 58
      Z
    "
    fill="none"
    stroke="url(#gold)"
    stroke-width="9"
    opacity="0.95"
  />

  <!-- Inner arch -->
  <path
    d="
      M256 105
      C228 135 191 141 171 170
      C157 190 158 218 158 244
      V310
      H354
      V244
      C354 218 355 190 341 170
      C321 141 284 135 256 105
      Z
    "
    fill="none"
    stroke="#d5a942"
    stroke-width="4"
    opacity="0.85"
  />


  <!-- ============================= -->
  <!-- Central Islamic ornament -->
  <!-- ============================= -->

  <g transform="translate(256 178)">

    <!-- Outer star -->
    <path
      d="
        M0 -65
        L18 -40
        L48 -48
        L40 -18
        L65 0
        L40 18
        L48 48
        L18 40
        L0 65
        L-18 40
        L-48 48
        L-40 18
        L-65 0
        L-40 -18
        L-48 -48
        L-18 -40
        Z
      "
      fill="#0d704a"
      stroke="url(#gold)"
      stroke-width="4"
    />

    <!-- Inner floral shape -->
    <path
      d="
        M0 -48
        C12 -31 22 -28 39 -30
        C34 -15 39 -5 51 0
        C37 7 34 18 39 31
        C23 28 12 34 0 48
        C-12 34 -23 28 -39 31
        C-34 18 -37 7 -51 0
        C-39 -5 -34 -15 -39 -30
        C-22 -28 -12 -31 0 -48
        Z
      "
      fill="#188052"
      opacity="0.95"
    />

    <!-- Center diamond -->
    <path
      d="M0 -20 L20 0 L0 20 L-20 0 Z"
      fill="#07553a"
    />

    <!-- Golden center -->
    <path
      d="
        M0 -10
        L5 -5
        L11 0
        L5 5
        L0 10
        L-5 5
        L-11 0
        L-5 -5
        Z
      "
      fill="url(#gold)"
    />

  </g>


  <!-- ============================= -->
  <!-- Shadow underneath Quran -->
  <!-- ============================= -->

  <ellipse
    cx="256"
    cy="390"
    rx="190"
    ry="32"
    fill="#001e15"
    opacity="0.5"
    filter="url(#shadow)"
